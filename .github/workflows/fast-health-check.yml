name: PAO Fast Health Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fast-health-check.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect fast and safety workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          fast_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fast-2min-watch.yml --limit 5 --json databaseId,status,conclusion,event,createdAt,updatedAt,url,headSha)"
          pan_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow panathinaikos-realtime-v2.yml --limit 5 --json databaseId,status,conclusion,event,createdAt,updatedAt,url,headSha)"
          heal_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fast-self-heal.yml --limit 5 --json databaseId,status,conclusion,event,createdAt,updatedAt,url,headSha)"
          repair_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow repair-fast-cutover.yml --limit 5 --json databaseId,status,conclusion,event,createdAt,updatedAt,url,headSha)"

          fast_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fast-2min-watch.yml" --jq '.state')"
          watch_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/watch.yml" --jq '.state')"
          google_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/google-watch.yml" --jq '.state')"
          official_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/official-watch.yml" --jq '.state')"
          youtube_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/youtube-watch.yml" --jq '.state')"
          youtube_backup_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/youtube-backup-watch.yml" --jq '.state')"
          panathinaikos_v2_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/panathinaikos-realtime-v2.yml" --jq '.state')"
          self_heal_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fast-self-heal.yml" --jq '.state')"
          repair_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/repair-fast-cutover.yml" --jq '.state')"

          python - "$fast_runs" "$pan_runs" "$heal_runs" "$repair_runs" "$fast_state" "$watch_state" "$google_state" "$official_state" "$youtube_state" "$youtube_backup_state" "$panathinaikos_v2_state" "$self_heal_state" "$repair_state" <<'PY'
          import json, sys
          from datetime import datetime, timezone

          out = {
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "fast_workflow_state": sys.argv[5],
              "legacy_workflows": {
                  "watch.yml": sys.argv[6],
                  "google-watch.yml": sys.argv[7],
                  "official-watch.yml": sys.argv[8],
                  "youtube-watch.yml": sys.argv[9],
              },
              "safety_workflows": {
                  "youtube-backup-watch.yml": sys.argv[10],
                  "panathinaikos-realtime-v2.yml": sys.argv[11],
                  "fast-self-heal.yml": sys.argv[12],
                  "repair-fast-cutover.yml": sys.argv[13],
              },
              "fast_runs": json.loads(sys.argv[1]),
              "panathinaikos_v2_runs": json.loads(sys.argv[2]),
              "self_heal_runs": json.loads(sys.argv[3]),
              "repair_runs": json.loads(sys.argv[4]),
          }
          with open("fast_health.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Save health snapshot
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"
          git add fast_health.json
          if git diff --cached --quiet; then
            echo "No health snapshot changes"
            exit 0
          fi
          git commit -m "Update fast watcher health snapshot"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              sleep 2
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Failed to push health snapshot"
          exit 1

