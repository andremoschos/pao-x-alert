name: Repair Fast Cutover

on:
  push:
    paths:
      - ".github/workflows/repair-fast-cutover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make legacy-disable idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/fast-2min-watch.yml')
          s = p.read_text(encoding='utf-8')
          needle = '              "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/disable"\n          done'
          replacement = '              "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/disable" \\\n              || true\n          done'
          if replacement in s:
              print('Fast cutover already repaired.')
          elif needle in s:
              p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')
              print('Fast cutover repaired.')
          else:
              raise SystemExit('Expected disable block not found; refusing unsafe edit.')
          PY

      - name: Commit repair
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/fast-2min-watch.yml
          if git diff --cached --quiet; then
            echo "No repair commit needed"
            exit 0
          fi
          git commit -m "Fix fast watcher cutover on already-disabled workflows"
          git pull --rebase origin main
          git push origin HEAD:main
