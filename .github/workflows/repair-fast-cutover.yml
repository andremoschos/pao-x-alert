name: Repair Fast Cutover

on:
  push:
    paths:
      - ".github/workflows/repair-fast-cutover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make legacy disable idempotent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/fast-2min-watch.yml')
          text = path.read_text(encoding='utf-8')

          if 'already $state; no disable needed' in text:
              print('Cutover already repaired')
              raise SystemExit(0)

          pattern = re.compile(
              r'(?m)^(?P<i>[ ]*)for wf in "\$\{workflows\[@\]\}"; do\n'
              r'(?P=i)  gh api \\\n'
              r'(?P=i)    --method PUT \\\n'
              r'(?P=i)    "repos/\$GITHUB_REPOSITORY/actions/workflows/\$wf/disable"\n'
              r'(?P=i)done\n'
          )

          match = pattern.search(text)
          if not match:
              raise SystemExit('Target disable block not found; refusing broad edit')

          i = match.group('i')
          replacement = (
              f'{i}for wf in "${{workflows[@]}}"; do\n'
              f'{i}  state="$(\n'
              f'{i}    gh api \\\n'
              f'{i}      "repos/$GITHUB_REPOSITORY/actions/workflows/$wf" \\\n'
              f"{i}      --jq '.state'\n"
              f'{i}  )"\n\n'
              f'{i}  if [ "$state" = "active" ]; then\n'
              f'{i}    gh api \\\n'
              f'{i}      --method PUT \\\n'
              f'{i}      "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/disable"\n'
              f'{i}    echo "$wf disabled for fast cutover"\n'
              f'{i}  else\n'
              f'{i}    echo "$wf already $state; no disable needed"\n'
              f'{i}  fi\n'
              f'{i}done\n'
          )

          updated = text[:match.start()] + replacement + text[match.end():]
          path.write_text(updated, encoding='utf-8')
          print('Cutover repaired safely')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/fast-2min-watch.yml
          if git diff --cached --quiet; then
            echo "No change required"
            exit 0
          fi
          git commit -m "Make fast cutover safe when legacy workflows already disabled"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

# strict regex repair
