name: Repair Fast Cutover

on:
  push:
    paths:
      - ".github/workflows/repair-fast-cutover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make legacy disable idempotent
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/fast-2min-watch.yml')
          text = path.read_text(encoding='utf-8')

          old = '''          for wf in "${workflows[@]}"; do
            gh api \\
              --method PUT \\
              "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/disable"
          done
'''

          new = '''          for wf in "${workflows[@]}"; do
            state="$(
              gh api \\
                "repos/$GITHUB_REPOSITORY/actions/workflows/$wf" \\
                --jq '.state'
            )"

            if [ "$state" = "active" ]; then
              gh api \\
                --method PUT \\
                "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/disable"
              echo "$wf disabled for fast cutover"
            else
              echo "$wf already $state; no disable needed"
            fi
          done
'''

          if new in text:
              print('Cutover already repaired')
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Cutover repaired')
          else:
              raise SystemExit('Expected cutover block not found; refusing broad edit')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/fast-2min-watch.yml
          if git diff --cached --quiet; then
            echo "No change required"
            exit 0
          fi
          git commit -m "Make fast cutover safe when legacy workflows already disabled"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
