name: Repair Fast Cutover

on:
  push:
    paths:
      - ".github/workflows/repair-fast-cutover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted repair
        run: python repair_fast_cutover.py

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/fast-2min-watch.yml
          if git diff --cached --quiet; then
            echo "No change required"
            exit 0
          fi
          git commit -m "Make fast cutover safe when legacy workflows already disabled"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
