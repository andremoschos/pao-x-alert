name: Official PAO Website Backup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/official-website-backup.yml'
      - 'official_website_backup.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: official-pao-website-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check official websites
        env:
          NTFY_OFFICIAL_TOPIC: ${{ secrets.NTFY_OFFICIAL_TOPIC }}
        run: python official_website_backup.py
      - name: Save backup state
        run: |
          git config user.name 'pao-x-alert'
          git config user.email 'actions@users.noreply.github.com'
          git add -- official_website_backup_seen.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Official PAO website backup state'

          # The Fast watcher also writes state to main every few minutes. A
          # single pull/push can therefore lose a race even when this backup
          # check itself succeeded. Rebase and retry a few times so that such
          # benign concurrent state commits do not turn the backup workflow red.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying..."
            sleep $((attempt * 2))
          done

          echo 'Failed to save Official PAO backup state after 5 retries.' >&2
          exit 1
