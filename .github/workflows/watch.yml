name: Panathinaikos Full Watch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panathinaikos-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check X
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Check Google
        env:
          GOOGLE_ALERT_RSS: ${{ secrets.GOOGLE_ALERT_RSS }}
          NTFY_GOOGLE_TOPIC: ${{ secrets.NTFY_GOOGLE_TOPIC }}
        run: python google_monitor.py

      - name: Check Official PAO
        env:
          NTFY_OFFICIAL_TOPIC: ${{ secrets.NTFY_OFFICIAL_TOPIC }}
        run: python official_monitor.py

      - name: Check YouTube
        env:
          NTFY_YOUTUBE_TOPIC: ${{ secrets.NTFY_YOUTUBE_TOPIC }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_monitor.py

      - name: Save seen items
        if: success()
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"

          git add seen.json google_seen.json official_seen.json youtube_seen.json

          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "Update seen items"
          git pull --rebase origin main
          git push origin HEAD:main
