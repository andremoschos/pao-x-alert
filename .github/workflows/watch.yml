name: Panathinaikos X Watch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panathinaikos-x-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check X
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Save seen posts
        if: success()
        run: |
          if git diff --quiet -- seen.json; then
            echo "No seen.json changes"
            exit 0
          fi

          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"

          git add seen.json
          git commit -m "Update seen posts"

          # If main changed while this run was working, rebase first.
          git pull --rebase origin main
          git push origin HEAD:main
