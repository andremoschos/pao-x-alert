name: X / Twitter PAO Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: panathinaikos-watch
  cancel-in-progress: false

jobs:
  x-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install X dependencies
        run: |
          pip install requests "twscrape[curl]"

      - name: Check X
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Save X seen items
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"

          git add seen.json

          if git diff --cached --quiet; then
            echo "No X state changes"
            exit 0
          fi

          git commit -m "Update X seen items"
          git pull --rebase origin main
          git push origin HEAD:main
