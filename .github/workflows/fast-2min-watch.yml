name: PAO Fast 2-Min Watch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fast-2min-watch.yml"
  schedule:
    # The cron only refreshes the long-running runner.
    # Real checks happen inside the job every 120 seconds.
    - cron: "23 */4 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: pao-fast-2min-all
  cancel-in-progress: true

jobs:
  fast-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}

      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      GOOGLE_ALERT_RSS: ${{ secrets.GOOGLE_ALERT_RSS }}
      NTFY_GOOGLE_TOPIC: ${{ secrets.NTFY_GOOGLE_TOPIC }}

      NTFY_OFFICIAL_TOPIC: ${{ secrets.NTFY_OFFICIAL_TOPIC }}

      NTFY_YOUTUBE_TOPIC: ${{ secrets.NTFY_YOUTUBE_TOPIC }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

