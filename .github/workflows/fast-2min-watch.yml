name: PAO Fast 2-Min Watch

# Recovery trigger: refresh stalled long-running runner safely.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fast-2min-watch.yml"
      - "fast_runner_v2.py"
      - "monitor.py"
      - "panathinaikos_monitor.py"
      - "google_monitor.py"
      - "google_fast_adapter.py"
      - "conference_opponents_monitor.py"
      - "official_monitor.py"
      - "official_x_direct_monitor.py"
      - "youtube_monitor.py"
      - "telegram_delivery.py"
      - "transferfeed_monitor.py"
      - "requirements.txt"
  schedule:
    # Refresh the long-running runner every 4 hours.
    # Checks themselves run continuously every ~120 seconds.
    - cron: "23 */4 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: pao-fast-2min-all
  cancel-in-progress: true

jobs:
  fast-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_PANATHINAIKOS_TOPIC: ${{ secrets.NTFY_PANATHINAIKOS_TOPIC }}
      GOOGLE_ALERT_RSS: ${{ secrets.GOOGLE_ALERT_RSS }}
      NTFY_GOOGLE_TOPIC: ${{ secrets.NTFY_GOOGLE_TOPIC }}
      NTFY_OFFICIAL_TOPIC: ${{ secrets.NTFY_OFFICIAL_TOPIC }}
      NTFY_YOUTUBE_TOPIC: ${{ secrets.NTFY_YOUTUBE_TOPIC }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ONLY_PAO_CHAT_ID: "-5310508827"
      TELEGRAM_THREAD_X_GENERAL: ${{ secrets.TELEGRAM_THREAD_X_GENERAL }}
      TELEGRAM_THREAD_ONLY_PAO_X: ${{ secrets.TELEGRAM_THREAD_ONLY_PAO_X }}
      TELEGRAM_THREAD_GOOGLE: ${{ secrets.TELEGRAM_THREAD_GOOGLE }}
      TELEGRAM_THREAD_OFFICIAL: ${{ secrets.TELEGRAM_THREAD_OFFICIAL }}
      TELEGRAM_THREAD_YOUTUBE: ${{ secrets.TELEGRAM_THREAD_YOUTUBE }}
      TELEGRAM_THREAD_SYSTEM: ${{ secrets.TELEGRAM_THREAD_SYSTEM }}
      TELEGRAM_THREAD_CONFERENCE: "273"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Preflight resilient runner
        run: |
          python -m py_compile \
            fast_runner_v2.py \
            monitor.py \
            panathinaikos_monitor.py \
            google_monitor.py \
            google_fast_adapter.py \
            conference_opponents_monitor.py \
            official_monitor.py \
            official_x_direct_monitor.py \
            youtube_monitor.py \
            telegram_delivery.py \
            transferfeed_monitor.py

      - name: Retire legacy safety workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for wf in watch.yml google-watch.yml official-watch.yml youtube-watch.yml; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf" --jq '.state')"
            if [ "$state" = "active" ]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/disable"
              echo "$wf disabled; resilient Fast runner is ready"
            else
              echo "$wf already $state"
            fi
          done

      - name: Run resilient 2-minute PAO watchers
        shell: bash
        run: python fast_runner_v2.py

      - name: Restore legacy safety if Fast exits with failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Fast failed; restoring legacy safety workflows."
          for wf in watch.yml google-watch.yml official-watch.yml youtube-watch.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" || true
          done
