      - name: Safe cutover and smoke test
        shell: bash
        run: |
          set -u

          workflows=(
            watch.yml
            google-watch.yml
            official-watch.yml
            youtube-watch.yml
          )

          echo "Temporarily disabling old 5-minute workflows..."

          for wf in "${workflows[@]}"; do
            gh api \
              --method PUT \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/disable"
          done

          # Give any already-running short old job a moment to finish.
          sleep 20

          status=0

          echo "SMOKE: X general"
          python /tmp/fast_runner.py --topic x || status=1

          echo "SMOKE: Google"
          python /tmp/fast_runner.py --topic google || status=1

          echo "SMOKE: Official"
          python /tmp/fast_runner.py --topic official --slow || status=1

          echo "SMOKE: YouTube"
          python /tmp/fast_runner.py --topic youtube || status=1

          if [ "$status" -ne 0 ]; then
            echo "Fast smoke test failed. Re-enabling old workflows."

            for wf in "${workflows[@]}"; do
              gh api \
                --method PUT \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" \
                || true
            done

            exit 1
          fi

          echo "Smoke test passed. Fast 2-minute mode is active."

          for wf in "${workflows[@]}"; do
            state="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$wf" \
                --jq '.state'
            )"

            echo "$wf state=$state"
          done

      - name: Run 2-minute PAO watchers
        shell: bash
        run: |
          python /tmp/fast_runner.py
