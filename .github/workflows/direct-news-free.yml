name: PAO Direct News Free Retiring

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/direct-news-free.yml"

concurrency:
  group: pao-direct-news-free
  cancel-in-progress: true

jobs:
  stop-direct-news:
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: echo "GitHub direct-news sender retired; Railway is the sole direct-news sender."
