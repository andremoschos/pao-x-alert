name: PAO Fast Self-Heal

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fast-self-heal.yml"
  schedule:
    # Stagger away from the top of the hour and check every 10 minutes.
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: pao-fast-self-heal
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current heartbeat
        uses: actions/checkout@v4

      - name: Keep PAO Fast 2-Min watcher alive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # A GitHub run can remain in_progress while the internal loop is
          # silently stuck, so validate the persisted heartbeat too. Fresh
          # runners get a startup grace window so they can finish the first
          # full X/Google/Official/YouTube cycle before heartbeat enforcement.
          active_runs="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow fast-2min-watch.yml \
              --limit 10 \
              --json databaseId,status,createdAt \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")]'
          )"

          active="$(jq 'length' <<<"$active_runs")"
          echo "Active/queued Fast runs: $active"

          startup_grace="$(python - "$active_runs" <<'PY'
          import json, sys
          from datetime import datetime, timezone

          try:
              runs = json.loads(sys.argv[1])
              if not runs:
                  print("0")
              else:
                  ages = []
                  now = datetime.now(timezone.utc)
                  for run in runs:
                      raw = run.get("createdAt")
                      if not raw:
                          continue
                      dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                      ages.append((now - dt.astimezone(timezone.utc)).total_seconds())
                  youngest = min(ages) if ages else 999999
                  print("1" if youngest <= 720 else "0")
                  print(f"Youngest active Fast run age seconds: {youngest:.0f}", file=sys.stderr)
          except Exception as exc:
              print(f"Startup-grace parse error: {exc}", file=sys.stderr)
              print("0")
          PY
          )"

          stale="$(python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          try:
              data = json.loads(Path("fast_health.json").read_text(encoding="utf-8"))
              raw = data.get("last_cycle_finished_at") or data.get("runner_started_or_alive_at")
              if not raw:
                  print("1")
              else:
                  dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  age = (datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds()
                  print("1" if age > 720 else "0")
                  print(f"Heartbeat age seconds: {age:.0f}", file=__import__("sys").stderr)
          except Exception as exc:
              print(f"Heartbeat parse error: {exc}", file=__import__("sys").stderr)
              print("1")
          PY
          )"

          if [ "$active" -gt 0 ] && [ "$startup_grace" = "1" ]; then
            echo "Fresh Fast runner is inside 12-minute startup grace. No repair needed."
            exit 0
          fi

          if [ "$active" -gt 0 ] && [ "$stale" = "0" ]; then
            echo "Fast 2-Min watcher is active and heartbeat is fresh. No repair needed."
            exit 0
          fi

          if [ "$stale" = "1" ]; then
            echo "Fast watcher heartbeat is stale. Cancelling stuck active runs..."
            jq -r '.[].databaseId' <<<"$active_runs" | while read -r run_id; do
              [ -n "$run_id" ] && gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            done
          else
            echo "No active Fast runner found."
          fi

          echo "Enabling safety-net workflows before restart..."
          for wf in watch.yml google-watch.yml official-watch.yml youtube-watch.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" || true
          done

          echo "Dispatching a fresh Fast 2-Min run..."
          gh workflow run fast-2min-watch.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Self-heal restart dispatched."
