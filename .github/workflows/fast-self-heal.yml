name: PAO Fast Self-Heal

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fast-self-heal.yml"
  schedule:
    # Last-resort refresh only. The watchdog normally hands off to itself,
    # so recovery no longer depends on GitHub cron firing every few minutes.
    - cron: "17 */4 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: pao-fast-continuous-watchdog
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 260

    steps:
      - name: Run continuous PAO recovery watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u

          check_fast() {
            active_runs="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow fast-2min-watch.yml \
                --limit 10 \
                --json databaseId,status,createdAt \
                --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")]' \
                2>/dev/null || echo '[]'
            )"

            active="$(jq 'length' <<<"$active_runs" 2>/dev/null || echo 0)"

            youngest_age="$(python - "$active_runs" <<'PY'
          import json, sys
          from datetime import datetime, timezone

          try:
              runs = json.loads(sys.argv[1])
              now = datetime.now(timezone.utc)
              ages = []
              for run in runs:
                  raw = run.get("createdAt")
                  if not raw:
                      continue
                  dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  ages.append((now - dt.astimezone(timezone.utc)).total_seconds())
              print(int(min(ages)) if ages else 999999)
          except Exception:
              print(999999)
          PY
            )"

            heartbeat_tmp="$(mktemp)"
            if ! gh api \
              "repos/$GITHUB_REPOSITORY/contents/fast_health.json?ref=main" \
              --jq '.content' 2>/dev/null \
              | tr -d '\n' \
              | base64 --decode >"$heartbeat_tmp" 2>/dev/null; then
              echo '{}' >"$heartbeat_tmp"
            fi

            heartbeat_age="$(python - "$heartbeat_tmp" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          try:
              data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              raw = data.get("last_cycle_finished_at") or data.get("runner_started_or_alive_at")
              if not raw:
                  print(999999)
              else:
                  dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  age = (datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds()
                  print(max(0, int(age)))
          except Exception:
              print(999999)
          PY
            )"
            rm -f "$heartbeat_tmp"

            echo "Fast active=$active youngest_age=${youngest_age}s heartbeat_age=${heartbeat_age}s"

            # A newly-started runner gets 12 minutes to install dependencies and
            # finish its first full cycle. After that the persisted heartbeat must
            # remain fresher than 12 minutes.
            if [ "$active" -gt 0 ] && { [ "$youngest_age" -le 720 ] || [ "$heartbeat_age" -le 720 ]; }; then
              echo "Fast watcher healthy."
              return 0
            fi

            echo "Fast watcher missing or stale: repairing now."

            jq -r '.[].databaseId' <<<"$active_runs" 2>/dev/null | while read -r run_id; do
              if [ -n "$run_id" ]; then
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
              fi
            done

            # Keep critical source coverage alive while the fresh Fast runner
            # installs and starts. These are manual dispatches, so recovery does
            # not depend on their cron schedules either.
            gh workflow run youtube-backup-watch.yml \
              --repo "$GITHUB_REPOSITORY" --ref main || true
            gh workflow run official-website-backup.yml \
              --repo "$GITHUB_REPOSITORY" --ref main || true

            gh workflow run fast-2min-watch.yml \
              --repo "$GITHUB_REPOSITORY" --ref main

            echo "Fresh Fast runner dispatched."
          }

          # Stay alive for ~3h50m and check every five minutes. Before GitHub's
          # long-job limits become relevant, hand off to a fresh watchdog run.
          for cycle in $(seq 1 46); do
            echo "--- recovery watchdog cycle $cycle/46 ---"
            check_fast || true
            sleep 300
          done

          echo "Handing recovery watchdog to a fresh run..."
          gh workflow run fast-self-heal.yml \
            --repo "$GITHUB_REPOSITORY" --ref main || true
