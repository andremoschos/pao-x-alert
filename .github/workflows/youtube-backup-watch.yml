name: YouTube PAO Backup Watch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/youtube-backup-watch.yml"
      - "youtube_backup_guard.py"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: youtube-pao-backup-watch
  cancel-in-progress: false

jobs:
  youtube-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Check YouTube only if primary is stale
        env:
          NTFY_YOUTUBE_TOPIC: ${{ secrets.NTFY_YOUTUBE_TOPIC }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_backup_guard.py

      - name: Save YouTube recovery state
        if: success()
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"

          git add youtube_seen.json

          if git diff --cached --quiet; then
            echo "No YouTube recovery state changes"
            exit 0
          fi

          git commit -m "Update YouTube backup state"

          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              sleep 2
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "Failed to push YouTube backup state after retries"
          exit 1
