name: Patch Athletic Direct Filter

on:
  push:
    paths:
      - ".github/workflows/patch-athletic-direct-filter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Athletic direct filter
        run: python patch_athletic_direct_filter.py

      - name: Commit Google filter update
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"
          git add google_monitor.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Handle Athletic as path-specific Telegram direct source"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              sleep 2
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
