name: X RSSHub Fallback Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - x_rsshub_diagnostic.py
      - x_rsshub_fallback.py
      - .github/workflows/x-rsshub-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-rsshub-x:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Test production PAO X timelines
        run: python x_rsshub_diagnostic.py

      - name: Verify production aggregation parser
        run: |
          python - <<'PY'
          import x_rsshub_fallback as x
          accounts = [
              'paofc_', 'Paobcgr', 'acpanathinaikos', 'paobc',
              'fmeetsdata', 'Onlypao_gr', 'papanikolaouchs'
          ]
          tweets = x.fetch_users(accounts, 100)
          assert tweets
          assert all(item['id'].isdigit() and '/status/' in item['url'] for item in tweets)
          authors = {item['author'].lstrip('@').lower() for item in tweets}
          assert 'onlypao_gr' in authors
          assert 'papanikolaouchs' in authors
          print('X_PRODUCTION_TIMELINE_SMOKE', {'count': len(tweets), 'authors': sorted(authors)})
          PY
