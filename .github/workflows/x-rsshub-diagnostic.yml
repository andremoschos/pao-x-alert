name: X RSSHub Fallback Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - x_rsshub_diagnostic.py
      - x_rsshub_fallback.py
      - monitor.py
      - panathinaikos_monitor.py
      - .github/workflows/x-rsshub-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-rsshub-x:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Verify full production X Latest path
        run: |
          python - <<'PY'
          import x_rsshub_fallback as x

          direct = {}
          for query in ('Panathinaikos', '#Panathinaikos'):
              tweets = x._fetch_x_authenticated_keyword(query, 40)
              assert tweets, f'{query}: 0 posts'
              authors = {item['author'].lstrip('@').lower() for item in tweets}
              assert len(authors) >= 3, f'{query}: global Latest coverage too narrow: {sorted(authors)}'
              assert all(item['id'].isdigit() and '/status/' in item['url'] for item in tweets)
              for item in tweets:
                  direct[item['id']] = item
              print('X_AUTH_LATEST_SMOKE', {
                  'query': query,
                  'count': len(tweets),
                  'authors': len(authors),
                  'latest': tweets[0]['url'],
              }, flush=True)

          assert direct
          print('X_AUTH_GLOBAL_LATEST_OK', {
              'unique_posts': len(direct),
              'unique_authors': len({item['author'].lower() for item in direct.values()}),
          }, flush=True)

          general = x.fetch_general(120)
          assert general
          general_authors = {item['author'].lstrip('@').lower() for item in general}
          assert len(general_authors) >= 3
          print('X_GENERAL_PRODUCTION_OK', {
              'count': len(general),
              'authors': len(general_authors),
              'latest': general[0]['url'],
          }, flush=True)

          only = x.fetch_many_keywords(['Panathinaikos', '#Panathinaikos'], 120)
          assert only
          only_authors = {item['author'].lstrip('@').lower() for item in only}
          assert len(only_authors) >= 3
          print('X_ONLY_PAO_PRODUCTION_OK', {
              'count': len(only),
              'authors': len(only_authors),
              'latest': only[0]['url'],
          }, flush=True)
          PY

      - name: Verify emergency timeline recovery
        run: |
          python - <<'PY'
          import x_rsshub_fallback as x
          accounts = [
              'paofc_', 'Paobcgr', 'acpanathinaikos', 'paobc',
              'fmeetsdata', 'Onlypao_gr', 'papanikolaouchs'
          ]
          tweets = x.fetch_users(accounts, 100)
          assert tweets
          assert all(item['id'].isdigit() and '/status/' in item['url'] for item in tweets)
          print('X_TIMELINE_RECOVERY_SMOKE', {'count': len(tweets)})
          PY
