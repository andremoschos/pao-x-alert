name: X RSSHub Fallback Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - x_rsshub_diagnostic.py
      - x_rsshub_fallback.py
      - .github/workflows/x-rsshub-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-rsshub-x:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Test RSSHub X feeds
        run: python x_rsshub_diagnostic.py

      - name: Verify production fallback parser
        run: |
          python - <<'PY'
          import x_rsshub_fallback as x
          official = x.fetch_user('paofc_', 10)
          keyword = x.fetch_keyword('Panathinaikos', 10)
          assert official and keyword
          assert all(item['id'].isdigit() and '/status/' in item['url'] for item in official + keyword)
          print('RSSHUB_PRODUCTION_SMOKE', {'official': len(official), 'keyword': len(keyword), 'official_latest': official[0]['url'], 'keyword_latest': keyword[0]['url']})
          PY
