name: X RSSHub Fallback Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - x_rsshub_diagnostic.py
      - x_rsshub_fallback.py
      - .github/workflows/x-rsshub-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-rsshub-x:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Verify true X Latest search
        run: |
          python - <<'PY'
          import x_rsshub_fallback as x
          all_authors = set()
          for query in ('Panathinaikos', '#Panathinaikos'):
              tweets = x._fetch_x_authenticated_keyword(query, 40)
              assert tweets, query
              assert all(item['id'].isdigit() and '/status/' in item['url'] for item in tweets)
              authors = {item['author'].lstrip('@').lower() for item in tweets}
              assert 'unknown' not in authors, (query, sorted(authors))
              all_authors.update(authors)
              print('X_TRUE_LATEST_SMOKE', {
                  'query': query,
                  'count': len(tweets),
                  'authors': len(authors),
                  'latest': tweets[0]['url'],
              })
          assert len(all_authors) >= 3, sorted(all_authors)
          PY

      - name: Verify emergency timeline recovery
        run: |
          python - <<'PY'
          import x_rsshub_fallback as x
          accounts = [
              'paofc_', 'Paobcgr', 'acpanathinaikos', 'paobc',
              'fmeetsdata', 'Onlypao_gr', 'papanikolaouchs'
          ]
          tweets = x.fetch_users(accounts, 100)
          assert tweets
          assert all(item['id'].isdigit() and '/status/' in item['url'] for item in tweets)
          print('X_TIMELINE_RECOVERY_SMOKE', {'count': len(tweets)})
          PY
