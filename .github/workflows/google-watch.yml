name: Google News + Web Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "1-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: google-pao-watch
  cancel-in-progress: false

jobs:
  google-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Check Google News + Web
        env:
          GOOGLE_ALERT_RSS: ${{ secrets.GOOGLE_ALERT_RSS }}
          NTFY_GOOGLE_TOPIC: ${{ secrets.NTFY_GOOGLE_TOPIC }}
        run: python google_monitor.py

      - name: Save Google seen items
        if: success()
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"

          git add google_seen.json

          if git diff --cached --quiet; then
            echo "No Google state changes"
            exit 0
          fi

          git commit -m "Update Google seen items"
          git pull --rebase origin main
          git push origin HEAD:main
