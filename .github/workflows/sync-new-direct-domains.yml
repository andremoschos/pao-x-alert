name: Sync New Direct Domains

on:
  push:
    paths:
      - ".github/workflows/sync-new-direct-domains.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Google direct-domain filter
        run: python sync_new_direct_domains.py

      - name: Commit filter update
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"
          git add google_monitor.py
          if git diff --cached --quiet; then
            echo "No filter changes needed"
            exit 0
          fi
          git commit -m "Sync international Telegram direct domains into Google filter"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              sleep 2
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
