name: X Panathinaikos Free Realtime

on:
  workflow_dispatch:
  schedule:
    # Refresh the long-running runner every 4 hours.
    - cron: "17 */4 * * *"

permissions:
  contents: read

concurrency:
  group: x-panathinaikos-free-realtime
  cancel-in-progress: true

jobs:
  x-panathinaikos-free-realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install curl_cffi beautifulsoup4

      - name: Run free Panathinaikos realtime watcher
        env:
          NTFY_PANATHINAIKOS_TOPIC: ${{ secrets.NTFY_PANATHINAIKOS_TOPIC }}
        run: python panathinaikos_nitter_realtime.py
