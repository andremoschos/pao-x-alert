name: X Panathinaikos Only Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "3-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: x-panathinaikos-only-watch
  cancel-in-progress: false

jobs:
  x-panathinaikos-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install X dependencies
        run: |
          pip install requests "twscrape[curl]"

      - name: Check X Panathinaikos
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          NTFY_PANATHINAIKOS_TOPIC: ${{ secrets.NTFY_PANATHINAIKOS_TOPIC }}
        run: python panathinaikos_monitor.py

      - name: Save Panathinaikos seen items
        if: success()
        run: |
          git config user.name "pao-x-alert"
          git config user.email "actions@users.noreply.github.com"
          git add panathinaikos_seen.json

          if git diff --cached --quiet; then
            echo "No Panathinaikos state changes"
            exit 0
          fi

          git commit -m "Update Panathinaikos X seen items"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote changed during push; retrying..."
            sleep 2
          done

          echo "Failed to push Panathinaikos state after retries"
          exit 1
