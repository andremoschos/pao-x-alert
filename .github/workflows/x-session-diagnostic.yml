name: X Session Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - x_session_diagnostic.py
      - .github/workflows/x-session-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-x-session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run safe X session diagnostic
        run: python x_session_diagnostic.py
