name: Kick PAO Fast Watch

on:
  push:
    paths:
      - ".github/workflows/kick-fast-watch.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare legacy workflows for safe cutover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in watch.yml google-watch.yml official-watch.yml youtube-watch.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" || true
          done

      - name: Start fast watcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fast-2min-watch.yml --repo andremoschos/pao-x-alert --ref main

# Robust restart: enable legacy workflows before fast cutover.
