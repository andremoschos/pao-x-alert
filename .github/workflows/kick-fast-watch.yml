name: Kick PAO Fast Watch

on:
  push:
    paths:
      - ".github/workflows/kick-fast-watch.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Start fast watcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fast-2min-watch.yml --repo andremoschos/pao-x-alert --ref main

# Manual reloads no longer enable legacy watchers. The resilient Fast workflow
# performs preflight first, then retires legacy safety workflows itself.
# Self-heal can still enable legacy safety only when the Fast runner is actually stale.
