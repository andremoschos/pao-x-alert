name: Kick PAO Fast Watch

on:
  push:
    paths:
      - ".github/workflows/kick-fast-watch.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Run fast cutover repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run repair-fast-cutover.yml --repo andremoschos/pao-x-alert --ref main

