name: Kick PAO Fast Watch

on:
  push:
    paths:
      - ".github/workflows/kick-fast-watch.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Official ntfy route
        run: |
          curl -fsS \
            -H "Title: OFFICIAL PAO - ROUTE TEST" \
            -H "Priority: high" \
            -H "Tags: green_circle" \
            -d "Official PAO ntfy route is connected. The 2-minute watcher is restarting now." \
            https://ntfy.sh/newspao-official-pao-847291

      - name: Start fast watcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fast-2min-watch.yml --repo andremoschos/pao-x-alert --ref main

